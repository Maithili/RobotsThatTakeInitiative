# Hand-curated citations (SPEC §5.5), checked against each paper's reference list. The build merges these
# with data/citations.json. One entry per pair, `from` cites `to`, both paper ids:
#   - {from: citing-paper-id, to: cited-paper-id, source: "Librarian, Oct 21 2026", where: "§2, ref. [14]"}
# `source` names who checked it. `where` (optional) gives the location in `from`'s text.
#
# Oct 21, 2026: every confirmed citation between two papers in the database, from the librarian's answers
# (each paper's citations section and the corrections table). Rudra et al. and Dhakal et al. 2023 are cited
# often but are not in the database, so they are left out.

# SGM
- {from: sgm, to: stot, source: "Librarian, Oct 21 2026", where: "Sec. 2, p. 3 (author-year, \"most related, concurrent\")"}

# Din 2025
