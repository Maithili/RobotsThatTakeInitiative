levels:                       # ordered by increasing unknowns
  L0:
    name: Reactive assistance
    knowns: {goal: known, human_policy: known}
    definition: The goal, and user action sequences if collaborating, are known to the robot. Realistic only in rigid settings such as industrial manufacturing.
  L1:
    name: Collaborative proactive assistance
    knowns: {goal: known, human_policy: unknown}
    definition: The robot knows the task goal but must infer user actions to coordinate effectively.
  L2:
    name: Unprompted proactive assistance
    knowns: {goal: unknown, human_policy: unknown}
    definition: The robot acts towards predicted needs without being prompted at all.

families:                     # L2 only, from GAP paper §III-B. Graph hues follow this order: teal, coral, blue, green (SPEC §7.2)
  goal_inference:
    name: Goal Inference
    definition: Online goal inference followed by goal-conditioned planning.
    scope_line: Infers the current goal. Assumes the goal space, action-goal association, and human policy are given. Does not anticipate future goals.
    limitations:
      - Needs the full set of goals with ground-truth goal annotations for past actions.
      - Assists only with the current task, once the belief concentrates.
      - Ignores habits and preferred variants.
  temporal_imitation:
    name: Temporal Imitation
    definition: Learns what the user tends to do next from temporal patterns and imitates the predicted action.
    scope_line: Anticipates future goals at the action level. Skips goal inference and human policy learning. Assumes uniform cost across actions.
    strength: Predicts minutes to hours ahead, with no need for close collaboration.
    limitations:
      - Discards the intentional structure of behavior that a goal-level model can exploit.
  implicit_cues:
    name: Implicit Cues
    definition: Reacts to implicit cues in the scene or from people, without a stated goal.
    semi_tangential: true     # per Maithili, Oct 21 2026. Drawn part-way transparent (SPEC §7.2).

action_types:                 # GAP paper §II
  act:      {label: Acts, definition: Executes actions that serve anticipated needs.}
  timing:   {label: Times, definition: Decides the precise timing of an action.}
  initiate: {label: Initiates, definition: Chooses to initiate an interaction.}
  inform:   {label: Informs, definition: Provides extra information.}
  ask:      {label: Asks, definition: Actively asks questions.}

observation_modalities:       # extend as papers need, one line each
  object_relocations: {label: Object relocations, definition: Timestamped moves of objects between locations.}
  scene_graph:        {label: Scene graphs, definition: Graphs of objects and their spatial relations over time.}
  video:              {label: Video, definition: Camera frames of the user and scene.}
  language:           {label: Language, definition: Spoken or written user input.}

stages:
  grounding:    {name: Grounding,    definition: Models the intentional structure behind user actions.}
  anticipation: {name: Anticipation, definition: Reasons over temporal user behavior to provide an anticipated need, goal, or action.}
  planning:     {name: Planning,     definition: Predicts robot actions by optimizing toward an anticipated variable.}

subproblems:                  # GAP paper Table I and §III-A. input/output are TeX.
  G1:
    name: Goal-space representation
    short: Goal space
    stage: grounding
    input: '\xi_{0:t}'
    output: '\mathcal{G}'
    challenge: Keeping the goal space coarse enough to model intent yet fine enough to separate variations.
    depends_on: []
    approaches: {hierarchical: Hierarchical representations, open_set_language: Open-set representations grounded in language}
  G2:
    name: Action-goal association
    short: Action-goal association
    stage: grounding
    input: '\xi_{0:t},\ \mathcal{G}'
    output: 'g_{0:t}'
    challenge: Disentangling interleaved actions across concurrent goals and isolating extraneous ones.
    depends_on: [G1]
    approaches: {symbolic: Symbolic models, learned: Learned models, hindsight_relabeling: Hindsight relabeling}
  A1:
    name: Human policy learning
    short: Human policy
    stage: anticipation
    input: '\xi_{0:t},\ \mathcal{G},\ g_{0:t}'
    output: '\pi^h'
    challenge: Adapting based on limited user-specific data.
    depends_on: [G1, G2]
    approaches: {lfd: Learning from demonstration, lfo: Learning from observation, clustering_mixture: User clustering and mixture models, guided_demonstration: Guiding users toward effective demonstrations}
  A2:
    name: Goal inference
    short: Goal inference
    stage: anticipation
    input: '\xi_{t-\Delta t:t},\ \mathcal{G},\ \pi^h'
    output: 'g_t'
    challenge: Disambiguating among many goals and assisting despite uncertainty over goals.
    depends_on: [G1, A1]
    approaches: {symbolic: Symbolic, learned: Learned, hybrid: Hybrid}
  A3:
    name: Goal anticipation
    short: Goal anticipation
    stage: anticipation
    input: '\xi_{0:t},\ \mathcal{G},\ g_{0:t}'
    output: 'g_{t:t+\Delta t}\ \text{or}\ \phi'
    challenge: Learning from wider context, such as habitual behavior patterns.
    depends_on: [G1, G2]
    approaches: {language_model: Language models, temporal_sequence: Temporal sequence prediction, probabilistic_filtering: Probabilistic filtering of object movement}
  P1:
    name: Cost modeling
    short: Cost model
    stage: planning
    input: 's_t,\ a^r_t,\ a^h_t'
    output: 'c_h(a^h_t)'
    challenge: Cost components are personal, context-dependent, and depend on the robot's concurrent actions.
    depends_on: []
    approaches: {task_complexity: Task complexity, fatigue: Effort and fatigue, preference_feedback: Preferences from user feedback, interruptibility: Interruptibility}
  P2:
    name: Coordinated action selection
    short: Action selection
    stage: planning
    input: '\xi_{0:t},\ c_h(\cdot),\ \pi^h,\ g_{t:t+\Delta t}'
    output: 'a^r_t'
    challenge: Optimizing against a learned, adaptive human rather than a ground-truth or scripted one.
    depends_on: [P1, A1, A2, A3]   # A2 -> P2 pending confirmation (see §15)
    approaches: {cirl: Cooperative inverse RL, proactive_communication: Proactive communication, hedging: Hedging under uncertainty}

themes:                       # cross-cutting, GAP paper §III-A
  joint_optimization: {label: Joint optimization, definition: Optimizing across subproblems instead of solving each alone.}
  personalization:    {label: Personalization, definition: Learning user-specific patterns.}
  continual_learning: {label: Continual learning, definition: Adapting to drifting needs without forgetting.}
  user_interaction:   {label: User interaction, definition: Resolving uncertainty and answering user queries.}

tangent_types:                # works next to the algorithmic core. Maithili adds more. color: one of amber, magenta, sky, brown, a different one per category (SPEC §7.2)
  hri:            {label: User perceptions of proactivity, color: magenta, definition: User studies and reviews of how people see and define proactive robots.}
  conversational: {label: Conversational proactivity, color: sky, definition: Proactivity in conversational settings.}
  search:         {label: Dynamic mapping and object search, color: amber, definition: "Models how homes change over time and finds objects or people in them, given what to find."}

statuses:
  addresses: {glyph: "●", label: Addresses}
  assumes:   {glyph: "◐", label: Assumes given}
  skips:     {glyph: "○", label: Skips}

relations:
  direct:   {label: Direct, definition: Works on this subproblem in a proactivity setting.}
  adjacent: {label: Adjacent, definition: A starting point from an adjacent field.}

net_value:                    # GAP paper §II-A
  headline: '\Delta V - \Delta C'
  counterfactual: Effectiveness compares the trajectory ξ with the robot against the trajectory ξ′ that would unfold without it.
  terms:
    dV:       {label: "ΔV · value gained",      tex: '\Delta V',        definition: Achieving goals the user would otherwise leave uncompleted, or freeing time for other valued goals.}
    dC_saved: {label: "ΔC↓ · human cost saved", tex: '\Delta C_h\downarrow', definition: Reducing the cost of a goal the user would have completed anyway.}
    dC_added: {label: "ΔC↑ · human cost added", tex: '\Delta C_h\uparrow',   definition: An incorrect robot action forces the user to undo or redo actions.}
    Cr:       {label: "C_r · robot cost",       tex: 'C_r',             definition: Physical wear and charge consumption, often assumed zero.}

metric_categories:            # per Maithili, Oct 22 2026. Ordered. Each metric has a `category` (or none, see SPEC §8.6) and an optional `group`.
  change_in_user_actions:     {label: Change in user actions}
  object_movement_prediction: {label: Object movement prediction}
  activity_label_prediction:  {label: Activity label prediction}
  task_performance:           {label: Task performance}
  end_user_perceptions:       {label: End-user perceptions}
  implicit_need_detection:    {label: Implicit need detection}
  coordination_fluency:       {label: Coordination fluency}

metric_groups:                # metrics listed as one item in the metrics section, with one short definition (≤ 140). Members share a category.
  used_unused_objects:
    label: "Used and unused objects: correct, wrong, missed"
    definition: Predicted placements of objects the user moved or did not use in the window, as shares of each set.
  activity_object_f1:
    label: Activity and activity-object F1
    definition: Predicted against true activity at each time step, and averaged over joint activity-object labels.
  task_match_accuracy:
    label: Exact-match and subgoal accuracy
    definition: Share of predicted subgoal sequences, and of single subgoals, that match the annotated proactive task.
  goal_prf:
    label: Goal precision, recall, and F1
    definition: Predicted goal predicates against the user's true goal.
  robot_time_actions:
    label: Robot time and actions
    definition: Wall-clock seconds and executed actions to finish the episode or the tasks.
  task_cost:
    label: Task cost and its reduction
    definition: Of the robot's plan, averaged over task sequences, and in percent against a baseline planner.
  user_ratings:
    label: Ratings of goal knowledge, helpfulness, and trust
    definition: How much the agent knew about the goal, how helpful it was, and whether users would trust it.
  step_detection:
    label: Trigger, task, and step detection (accuracy and F1, micro and macro)
    definition: Scored on video, pooled over classes (micro) and averaged over classes (macro).
  ooi_detection:
    label: Object-of-interest detection (precision, recall, F1, accuracy)
    definition: Predicted against true presence in each frame.
  thread_entropy:
    label: Thread mixing and robot thread entropy
    definition: How user and robot actions mix across task threads, and how the robot's own actions spread, WAIT excluded.

evaluations_exclude: [saavedra-2026-scene-graphs, din-2025-proactivity]   # object search papers and Din's MSc thesis stay off the Evaluations page (Maithili, Oct 22 2026)

metric_kinds:                 # each metric also carries direction (higher or lower is better), unit, and a one-line `mapping_note` on why it serves its terms
  direct:    Measures one or more terms.
  proxy:     Mixes terms or measures them indirectly.
  unrelated: Does not map to ΔV − ΔC.

metrics:                      # GAP paper §IV-A2. Add more as papers come in.
  net_actions_saved:
    label: Net actions saved
    category: change_in_user_actions
    definition: Skipped user actions minus undo actions, as a percentage of baseline user actions.
    terms: [dC_saved, dC_added]
    kind: direct
    direction: higher
    unit: "%"
  perturbed_actions:
    label: Perturbed actions
    category: change_in_user_actions
    definition: User actions corrected because of a wrong robot action, as a percentage of baseline user actions.
    terms: [dC_added]
    kind: direct
    direction: lower
    unit: "%"
  f1:
    label: F1
    category: object_movement_prediction
    definition: Skipped actions as true positives, undo and corrected as false positives, done as-is as false negatives.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: fraction

  # ---- Added Oct 21, 2026 from the librarian's answers. Categories per Maithili, Oct 22, 2026.
  # ---- Grouped by the papers that use them.

  # Activity and object prediction, offline (GLOBE)
  activity_f1:
    label: Activity F1
    category: activity_label_prediction
    group: activity_object_f1
    definition: F1 of the predicted activity against the true activity at each time step.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores an anticipated activity, an intermediate step that triggers no robot action.
  object_f1:
    label: Object F1
    category: object_movement_prediction
    definition: Predicted against true object at each time step.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: fraction
    mapping_note: A right object could be brought to spare the user and a wrong one adds cost. Scored offline.
  joint_mean_f1:
    label: Mean F1 (activity-object)
    category: activity_label_prediction
    group: activity_object_f1
    definition: F1 averaged across all joint activity-object labels.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: fraction
    mapping_note: Carries object F1's link to cost but mixes in activity prediction, which maps to no term.

  # Object relocation prediction, offline (STOT, STREAK)
  used_correct:
    label: Used objects, correct
    category: object_movement_prediction
    group: used_unused_objects
    definition: Objects the user moved in the window whose predicted move goes to the right place, as a share of used objects.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: A correct move would spare the user that relocation, but it is scored offline and assumes the robot acts.
  used_wrong:
    label: Used objects, wrong
    category: object_movement_prediction
    group: used_unused_objects
    definition: Objects the user moved in the window that are predicted to move to the wrong place, as a share of used objects.
    terms: [dC_added]
    kind: proxy
    direction: lower
    unit: "%"
    mapping_note: A wrong move would make the user fetch the object back. Scored offline, so later drift is not counted.
  used_missed:
    label: Used objects, missed
    category: object_movement_prediction
    group: used_unused_objects
    definition: Objects the user moved in the window that are predicted to stay put, as a share of used objects.
    terms: [dC_saved]
    kind: proxy
    direction: lower
    unit: "%"
    mapping_note: Counts savings the robot forgoes, the shortfall in ΔC↓. A miss adds no cost.
  unused_correct:
    label: Unused objects, correct
    category: object_movement_prediction
    group: used_unused_objects
    definition: Objects the user did not use in the window that are predicted to stay put, as a share of unused objects.
    terms: [dC_added]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Leaving unneeded objects alone avoids added cost. It is the complement of unused objects moved.
  unused_wrong:
    label: Unused objects, wrong
    category: object_movement_prediction
    group: used_unused_objects
    definition: Objects the user did not use in the window that are predicted to move, as a share of unused objects.
    terms: [dC_added]
    kind: proxy
    direction: lower
    unit: "%"
    mapping_note: Moving an object nobody needs may make the user put it back. Scored offline.

  # Goal inference and helping (NOPA, Watch-And-Help)
  speedup:
    label: Speedup
    category: task_performance
    definition: Episode length with the user alone divided by episode length with the helper, minus 1.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: ratio
    mapping_note: Net change in the time to finish the user's goal. Savings and interference are not separated.
  task_success_rate:
    label: Task success rate
    category: task_performance
    definition: Share of episodes where every predicate of the user's goal holds before the step limit.
    terms: [dV]
    kind: proxy
    direction: higher
    unit: fraction
    mapping_note: Goals finished in time come close to ΔV, but the user alone also finishes most goals.
  cumulative_reward:
    label: Cumulative reward
    category: task_performance
    definition: Summed over the episode's steps, from −1 (failure) to 1 (goal reached in zero steps).
    terms: [dV, dC_saved]
    kind: proxy
    direction: higher
    unit: score
    mapping_note: Rewards finishing and finishing sooner, so it mixes completion with time saved.
  goal_predicate_precision:
    label: Goal precision
    category: task_performance
    group: goal_prf
    definition: Precision of the predicted goal predicates against the user's true goal.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores goal recognition from a demonstration. No robot action is counted.
  goal_predicate_recall:
    label: Goal recall
    category: task_performance
    group: goal_prf
    definition: Recall of the predicted goal predicates against the user's true goal.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores goal recognition from a demonstration. No robot action is counted.
  goal_predicate_f1:
    label: Goal F1
    category: task_performance
    group: goal_prf
    definition: F1 of the predicted goal predicates against the user's true goal.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores goal inference, an intermediate step. No robot action is counted.
  rated_goal_knowledge:
    label: Rated goal knowledge
    category: end_user_perceptions
    group: user_ratings
    definition: User rating from 1 to 7 of how much the agent knew about the true goal.
    terms: []
    kind: unrelated
    direction: higher
    unit: 1–7 rating
    mapping_note: Perceived goal understanding. Maps to no term.
  rated_helpfulness:
    label: Rated helpfulness
    category: end_user_perceptions
    group: user_ratings
    definition: User rating from 1 to 7 of how helpful the agent was (1 hurting, 4 neutral, 7 very helpful).
    terms: [dV, dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: 1–7 rating
    mapping_note: Users judge net help, which spans every human term, but only as a perception.
  rated_trust:
    label: Rated trust
    category: end_user_perceptions
    group: user_ratings
    definition: User rating from 1 to 7 of whether they would trust the agent to do its job.
    terms: []
    kind: unrelated
    direction: higher
    unit: 1–7 rating
    mapping_note: Trust maps to no term.

  # Video perception and task threads (ProAct)
  detection_accuracy:
    label: Detection accuracy
    category: implicit_need_detection
    group: step_detection
    definition: Micro-averaged accuracy of trigger, task, and step detection on video.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores perception of when and what to help with. No robot action is counted.
  detection_f1:
    label: Detection F1
    category: implicit_need_detection
    group: step_detection
    definition: Micro-averaged F1 of trigger, task, and step detection on video.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores perception of when and what to help with. No robot action is counted.
  detection_macro_accuracy:
    label: Detection mAcc
    category: implicit_need_detection
    group: step_detection
    definition: Accuracy averaged over classes (macro) for trigger, task, and step detection.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Same as detection accuracy, weighted toward rare classes. No robot action is counted.
  detection_macro_f1:
    label: Detection mF1
    category: implicit_need_detection
    group: step_detection
    definition: F1 averaged over classes (macro) for trigger, task, and step detection.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Same as detection F1, weighted toward rare classes. No robot action is counted.
  future_action_edit_distance:
    label: Future action edit distance
    category: activity_label_prediction
    definition: Predicted against true sequence of upcoming user actions.
    terms: []
    kind: unrelated
    direction: lower
    unit: not stated
    mapping_note: Scores anticipation of the user's next actions. No robot action is counted.
  parallel_actions:
    label: Parallel actions
    category: coordination_fluency
    definition: Share of effective robot actions on a different thread from the user's previous action.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Measures how often robot and user work apart. It may relate to interference but counts no cost.
  thread_mixing_entropy:
    label: Thread mixing entropy
    category: coordination_fluency
    group: thread_entropy
    definition: Entropy of how user and robot actions mix across task threads, WAIT excluded.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Describes how work is split. Maps to no term.
  robot_thread_entropy:
    label: Robot thread entropy
    category: coordination_fluency
    group: thread_entropy
    definition: Entropy of the robot's actions across task threads, WAIT excluded.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Describes how the robot's work is spread. Maps to no term.

  # Object search in changing homes (SGM, FlowMaps, EvolvingNav, PredictiveGraphs, TAP, Mullen 2025)
  location_accuracy:
    label: Location accuracy
    definition: Share of predictions that pick a furniture node holding an object matching the query.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores where an object is. It serves search but measures no cost or value.
  ndcg:
    label: NDCG
    definition: Normalized discounted cumulative gain of the ranked candidate locations.
    terms: []
    kind: unrelated
    direction: higher
    unit: score
    mapping_note: Scores the ranking of locations. Maps to no term.
  search_success_rate:
    label: Search success rate
    definition: Share of search episodes in which the robot ends near the target and sees it within its budget.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Finding the item would spare the user the search, but no user cost is measured.
  spl:
    label: SPL
    definition: Success weighted by path length, so success times the shortest path over the longer of the actual and shortest paths.
    terms: [dC_saved, Cr]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Mixes finding the item, a stand-in for user cost saved, with path efficiency, a robot cost.
  path_length:
    label: Path length
    definition: Distance the robot travels in an episode.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: m
    mapping_note: Travel drives wear and charge. It says nothing about the user.
  steps_to_find:
    label: Steps to find
    definition: Robot actions or steps taken until it finds the target. In SGM, the budget plus one if it never does.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: steps
    mapping_note: More steps mean more robot effort. The user's waiting time is not measured.
  task_time:
    label: Task time
    category: task_performance
    group: robot_time_actions
    definition: Wall-clock time the robot takes to finish the episode or the task sequence.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: s
    mapping_note: Robot time and effort. Any user waiting time is not measured as such.
  success_at_k:
    label: Success at K
    definition: Share of episodes where one of the first K ranked candidates brings the robot within reach and view of the target.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Same link as search success, at a candidate budget of K. Reported per K and averaged over K.
  spl_at_k:
    label: SPL at K
    definition: SPL over the first K ranked candidates, reported per K and averaged over K.
    terms: [dC_saved, Cr]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Mixes finding the item with path efficiency, as SPL does.
  min_fde:
    label: minFDE@K
    definition: 3D distance from the true box center to the closest of K predicted samples.
    terms: []
    kind: unrelated
    direction: lower
    unit: m
    mapping_note: Scores predicted object positions. Maps to no term.
  recall_at_1m:
    label: Rec@1
    definition: Share of queries where the best of K samples lies within 1 m of the true position on the floor plane.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores predicted object positions. Maps to no term.
  sample_density:
    label: Density
    definition: Average number of nearest-neighbor balls around true positions that each predicted sample falls in.
    terms: []
    kind: unrelated
    direction: higher
    unit: unitless
    mapping_note: Scores the predicted position distribution. Maps to no term.
  sample_coverage:
    label: Coverage
    definition: Share of true positions whose nearest-neighbor ball holds at least one predicted sample.
    terms: []
    kind: unrelated
    direction: higher
    unit: fraction
    mapping_note: Scores the predicted position distribution. Maps to no term.
  total_variation:
    label: TV
    definition: Total-variation divergence between predicted and true position histograms on a 0.5 m floor grid.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Scores the predicted position distribution. Maps to no term.
  js_divergence:
    label: JS
    definition: Jensen-Shannon divergence between predicted and true position histograms on a 0.5 m floor grid.
    terms: []
    kind: unrelated
    direction: lower
    unit: nats
    mapping_note: Scores the predicted position distribution. Maps to no term.
  eventual_search_success:
    label: Search SR
    definition: Share of episodes where the target is found at some point within the budget. Not defined further.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Same link as search success, with a looser success test.
  first_inspection_success:
    label: First-inspection success
    definition: Share of episodes where the first candidate to get enough view coverage holds the target.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Rewards finding the item on the first look. It stands in for user cost saved, as search success does.
  recovery_success:
    label: Recovery success
    definition: Share of episodes with a failed first inspection in which the target is found later.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Search success after a first miss. Same link as search success.
  dynamic_success:
    label: Dynamic success
    definition: Search success on episodes where the target is scheduled to move after the query.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Search success on moving targets. Same link as search success.
  online_recovery_success:
    label: Online recovery success
    definition: Success on episodes whose scheduled move invalidates the target's earlier place. Only finds after the move count.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Search success when the target moves mid-search. Same link as search success.
  excess_distance:
    label: Excess distance
    definition: Path length minus the oracle shortest path, with a moving oracle for moving targets.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: m
    mapping_note: Extra robot travel, so robot wear and charge. Says nothing about the user.
  revisit_success:
    label: Revisit success
    definition: Share of reopened candidate visits that recover the target.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Checks the belief update after a miss. Maps to no term.
  inspections:
    label: Inspections
    definition: Number of candidate inspections per episode. Not defined further.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: count
    mapping_note: Each inspection is robot effort. Says nothing about the user.
  top1_accuracy:
    label: Top-1 accuracy
    definition: Top-1 accuracy of the predicted current state of the target. No formula given.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores object-state prediction. Maps to no term.
  mrr:
    label: MRR
    definition: Mean reciprocal rank of the target's true state among the candidates. No formula given.
    terms: []
    kind: unrelated
    direction: higher
    unit: unitless
    mapping_note: Scores object-state prediction. Maps to no term.
  nll:
    label: NLL
    definition: Negative log-likelihood of the target's true state under the predicted belief. No formula given.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Scores object-state prediction. Maps to no term.
  true_state_rank:
    label: True-state rank
    definition: Rank of the target's true state among the candidates. It captures changes beyond top-1 accuracy.
    terms: []
    kind: unrelated
    direction: lower
    unit: rank
    mapping_note: Scores object-state prediction. Maps to no term.
  ece:
    label: ECE
    definition: Expected calibration error, with predictions grouped by maximum confidence.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Scores how well the belief is calibrated. Maps to no term.
  persistence_mae:
    label: Persistence MAE
    definition: Mean absolute error between the predicted presence belief and the true presence of each object.
    terms: []
    kind: unrelated
    direction: lower
    unit: unitless
    mapping_note: Scores the persistence estimator. Maps to no term.
  persistence_balanced_accuracy:
    label: Persistence B-Acc
    definition: Balanced accuracy of presence predictions, with the belief thresholded at 0.5.
    terms: []
    kind: unrelated
    direction: higher
    unit: unitless
    mapping_note: Scores the persistence estimator. Maps to no term.
  persistence_f1:
    label: Persistence F1
    definition: F1 of presence predictions, with the belief thresholded at 0.5.
    terms: []
    kind: unrelated
    direction: higher
    unit: unitless
    mapping_note: Scores the persistence estimator. Maps to no term.
  abort_rate:
    label: Correct abort rate
    definition: Share of queries for absent objects where the robot correctly gives up.
    terms: [Cr]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: A correct abort ends wasted search. The user's cost of a wrong answer is not measured.
  absent_search_distance:
    label: Distance on absent queries
    definition: Distance the robot travels before stopping on queries for absent objects.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: m
    mapping_note: Robot travel spent searching for something that is not there.
  objects_found_ratio:
    label: Objects found ratio
    definition: Objects found in an episode over the most an optimal policy could find.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Found objects would spare the user a search, but no user cost is measured.
  trajectory_alignment:
    label: Trajectory alignment
    definition: Largest overlap, in nodes, between the agent's path and a ground-truth optimal path.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Measures similarity to the optimal path, not distance or effort. Maps to no term.
  relative_change_in_success:
    label: Relative change in success
    definition: Percent change in success or alignment between static and dynamic scenes. Closer to 0 is better.
    terms: []
    kind: unrelated
    direction: lower
    unit: "%"
    mapping_note: Measures robustness to object movement. Maps to no term.
  cumulative_success_rate:
    label: Cumulative success rate
    definition: Success accumulated over episodes in the lab replay. No formula given.
    terms: [dC_saved]
    kind: proxy
    direction: higher
    unit: not stated
    mapping_note: Same link as the objects found ratio, accumulated over episodes.
  emergency_false_negative_rate:
    label: Emergency false negatives
    definition: Share of episodes with an emergency in which none is reported.
    terms: [dV]
    kind: proxy
    direction: lower
    unit: fraction
    mapping_note: A missed emergency leaves the user without help they could not get alone. Far from household chores.
  emergency_false_positive_rate:
    label: Emergency false positives
    definition: Share of episodes without an emergency in which one is reported.
    terms: [dC_added]
    kind: proxy
    direction: lower
    unit: fraction
    mapping_note: A false alarm adds cost for the user or responders. That cost is not measured.

  # Anticipatory planning with no user in the loop (Anticipatory TAMP, Talukder 2025, Courteous Anticipation)
  avg_task_cost:
    label: Average cost per task
    category: task_performance
    group: task_cost
    definition: Robot plan cost per task, averaged over task sequences, from fixed action costs plus distance.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: cost units
    mapping_note: Time-like robot execution cost. With no user in the loop, no human term applies.
  cost_reduction:
    label: Cost reduction
    category: task_performance
    group: task_cost
    definition: Percent reduction in task cost relative to a baseline planner, such as a myopic one.
    terms: [Cr]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Relative form of average cost per task. Robot cost only.
  robot_action_count:
    label: Robot actions
    category: task_performance
    group: robot_time_actions
    definition: Number of actions the robot executes to finish the tasks.
    terms: [Cr]
    kind: proxy
    direction: lower
    unit: actions
    mapping_note: Robot effort. Says nothing about the user.

  # Proactive task prediction from egocentric images, offline (Din 2025)
  ooi_precision:
    label: OID precision
    category: implicit_need_detection
    group: ooi_detection
    definition: Share of frames flagged as holding an object of interest that do hold one.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores the per-frame trigger to act. No action is executed or costed.
  ooi_recall:
    label: OID recall
    category: implicit_need_detection
    group: ooi_detection
    definition: Share of frames holding an object of interest that are flagged.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores the per-frame trigger to act. No action is executed or costed.
  ooi_f1:
    label: OID F1
    category: implicit_need_detection
    group: ooi_detection
    definition: Harmonic mean of object-of-interest precision and recall.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores the per-frame trigger to act. No action is executed or costed.
  ooi_accuracy:
    label: OID accuracy
    category: implicit_need_detection
    group: ooi_detection
    definition: Share of frames correctly classified as holding an object of interest or not.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores the per-frame trigger to act. No action is executed or costed.
  relation_accuracy:
    label: Relation accuracy
    definition: Accuracy of predicted spatial relations (on, inside, next to) between object pairs. Not formally defined.
    terms: []
    kind: unrelated
    direction: higher
    unit: "%"
    mapping_note: Scores scene perception. Maps to no term.
  exact_match_accuracy:
    label: Exact-match accuracy
    category: activity_label_prediction
    group: task_match_accuracy
    definition: Share of predicted subgoal sequences that exactly match the annotated proactive task.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: A match would do the help annotators chose, and a mismatch may add cost. Scored offline against labels.
  subgoal_accuracy:
    label: Subgoal accuracy
    category: activity_label_prediction
    group: task_match_accuracy
    definition: Share of individual predicted subgoals that match the subgoals in the annotated sequence.
    terms: [dC_saved, dC_added]
    kind: proxy
    direction: higher
    unit: "%"
    mapping_note: Same link as exact-match accuracy, credited per subgoal.

loop_types:                   # ordered. `interaction` places each loop type on the realism plot's x axis (realism.interaction, SPEC §8.3).
  offline_replay:
    label: Offline replay
    definition: Scores each robot action against a fixed record of human behavior.
    interaction: open_loop
  closed_scripted:
    label: Closed loop, scripted human
    definition: Robot actions change the state, and a scripted human continues its routine from that state.
    interaction: closed_loop
  closed_adaptive:
    label: Closed loop, adaptive simulated human
    definition: A simulated human, such as an LLM proxy, adapts its actions to the robot.
    refs: [zhang-2023-llm-human-models]
    interaction: adaptive_humans
  user_study_short:
    label: User study, short
    definition: Real users interact with the robot in one or a few sessions.
    interaction: adaptive_humans   # real people adapt too
  user_study_longitudinal:
    label: User study, longitudinal
    definition: Real users live or work with the robot over weeks or longer.
    interaction: adaptive_humans   # real people adapt too

captures:                     # GAP paper Appendix I
  state_drift:     {label: State drift, definition: Robot errors shift the state, which compounds cost (Relaxation 1).}
  goal_adaptation: {label: Goal adaptation, definition: The user reallocates effort to new goals in response to the robot (Relaxation 2).}
  values: [yes, partial, no]

realism:                      # the plot in SPEC §8.3: interaction (x) by human behavior (y), per Maithili, Oct 22 2026. Setting and robot show only in its hover card. Levels ordered from far to close.
  robot:
    label: "Robot: closer to the target robot"
    levels:
      wizard:        {label: Wizard or oracle, definition: "A person or an oracle with ground truth chooses the robot's actions."}
      task_specific: {label: Task-specific policy, definition: "A policy learned for this task chooses the robot's actions."}
      generalist:    {label: Generalist policy, definition: "A general-purpose policy, such as an LLM planner, chooses the robot's actions."}
  human:                      # y axis: where the human behavior comes from
    label: "Human behavior: closer to real humans"
    levels:
      scripted:      {label: Scripted behavior, definition: "Behavior from a script, rules, or a planner."}
      crowdsourced:  {label: Generated behavior from crowdsourced data, definition: "Behavior generated from data people provided, such as crowdsourced routines."}
      real_humans:   {label: Real humans, definition: "Behavior of real people, live or recorded."}
  interaction:                # x axis. Derived from each evaluation's loop type (loop_types.*.interaction), never filled by hand.
    label: "Interaction: closer to humans who adapt"
    levels:
      open_loop:       {label: Open loop, definition: "Robot outputs are scored against a fixed record and change nothing."}
      closed_loop:     {label: Closed loop robot actions, definition: "Robot actions change the state, and the human carries on without adapting to the robot."}
      adaptive_humans: {label: Adaptive humans, definition: "The human, simulated or real, adapts to the robot's actions.", refs: [zhang-2023-llm-human-models]}
  environment:
    label: "Setting: closer to the target setting"
    levels:
      simulator:     {label: Simulator}
      vr:            {label: VR}
      lab:           {label: Lab}
      own_home:      {label: "Users' own homes"}
  # TODO(Maithili): set realism.source_url once the source paper is public (SPEC §16).
  source_url: null            # link to the paper this organization comes from, once it is public

action_space_complexity:      # colors the dots in the realism plot (SPEC §8.3). Per Maithili, Oct 22 2026. Levels ordered from low to high, at most 4.
  label: Action space complexity
  definition: The number of options the policy has at a given point in time.
  levels:
    low:       {label: Low, definition: "A fixed set of under 50 options, such as activity labels."}
    medium:    {label: Medium, definition: "50 to 100 options, such as 10 objects on any of 10 locations."}
    high:      {label: High, definition: "More than 100 options."}
    very_high: {label: Very high, definition: "Generative: an unbounded set of options."}

featured_comparison:          # drives the chart in §8.2
  title: Offline evaluation overstates performance
  metric: f1
  methods: [slate-pro, streak]
  columns:
    - {evaluation: gap-offline,         label: Offline}
    - {evaluation: gap-closed-llm,      label: "Closed loop, LLM user"}
    - {evaluation: gap-closed-scripted, label: "Closed loop, scripted user"}
  source: GAP paper, Table II
