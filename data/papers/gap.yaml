    loop: closed_scripted
    human_model: Scripted
    metrics:
      - net_actions_saved
      - perturbed_actions
      - f1
    baselines:
      - slate-pro
      - streak
    other_baselines:
      - Plain LLM
      - Oracle
    captures:
      state_drift: "yes"
      goal_adaptation: "no"
    provenance: GAP paper §IV-A, Table II
    realism:
      robot: task_specific
      human: scripted
      environment: simulator
    action_space_complexity: high  # derived: as gap-offline, HOMER+ placements 59 × 93 = 5,487
    results:
