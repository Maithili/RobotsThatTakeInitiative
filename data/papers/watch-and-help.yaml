# Seeded from spec/SEED.md; citation checked against the landing page (see data/SEED_REPORT.md).
id: watch-and-help
short_name: Watch-And-Help
title: "Watch-And-Help: A Challenge for Social Perception and Human-AI Collaboration"
authors:
  - Xavier Puig
  - Tianmin Shu
  - Shuang Li
  - Zilin Wang
  - Yuan-Hong Liao
  - Joshua B. Tenenbaum
  - Sanja Fidler
  - Antonio Torralba
venue: ICLR
year: 2021
links:
  paper: https://openreview.net/forum?id=w_7JMpGZRh0
  code: https://github.com/xavierpuigf/watch_and_help
provenance: GAP paper §III-B, Table I, App. II-A
method:
  knowns:
    goal: unknown
    human_policy: unknown
  family: goal_inference
  core_strength: null
  builds_on: []
subproblems:
  G1:
    status: assumes
    relation: direct
    note: Assumes the goal space is given
  G2:
    status: addresses
    relation: direct
    approach: symbolic
    note: Predicts goals from observed actions with symbolic models
  A1:
    status: assumes
    relation: direct
    note: Assumes the human policy is given
  A2:
    status: addresses
    relation: direct
    note: Online goal inference followed by goal-conditioned planning
  A3:
    status: skips
    relation: direct
    note: Does not predict future goals
evaluations:
  - id: watch-and-help-original
    environment: virtualhome
    datasets:
      - wah-task-set  # research agent audit, Oct 22 2026: WAH task set (WAH §3, §5.1, App. B)
    loop: offline_replay
    human_model: Recorded demonstrations (goal inference)
    metrics:
      - goal_predicate_precision
      - goal_predicate_recall
    provenance: GAP paper §IV; WAH §5.3 (the watch stage scores goal inference offline); Librarian Oct 2026, B-7
    realism:
      robot: task_specific
      human: scripted  # recorded demonstrations in VirtualHome. WAH simulation entries are scripted per Maithili, Oct 22 2026
      environment: simulator
    action_space_complexity: medium  # tagged by Maithili, Oct 22 2026. Goal inference over 30 predicate types, 2-8 predicates per goal (WAH §3)
  - id: watch-and-help-help
    environment: virtualhome
    datasets:
      - wah-task-set  # research agent audit, Oct 22 2026: WAH task set (WAH §3, §5.1, App. B)
    loop: closed_scripted
    human_model: Built-in planner agent (Alice)
    metrics:
      - task_success_rate
      - speedup
      - cumulative_reward
    provenance: WAH §3–5 (Alice replans each step from her latest observation); Librarian Oct 2026, B-7
    realism:
      robot: task_specific
      human: scripted  # built-in planner agent (Alice)
      environment: simulator
    action_space_complexity: high  # "167 different actions per step" on average, > 100 (WAH arXiv 2010.09890 App. A.2.4)
  - id: watch-and-help-human
    secondary: true  # user study. The main evaluation is the simulated one, per Maithili, Oct 22 2026
    environment: virtualhome
    datasets:
      - wah-task-set  # research agent audit, Oct 22 2026: the user studies run 30 test tasks of the WAH task set (WAH §6)
    loop: user_study_short
    human_model: 12 participants
    metrics:
      - task_success_rate
      - speedup
      - cumulative_reward
      - rated_goal_knowledge
      - rated_helpfulness
      - rated_trust
    provenance: "WAH §6, Experiment 2, App. D; Librarian Oct 2026, B-7"
    realism:
      robot: task_specific
      human: real_humans  # 12 participants
      environment: simulator
    action_space_complexity: high  # same helper and action space: "167 different actions per step" on average (WAH App. A.2.4)
